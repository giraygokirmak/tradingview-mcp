services:
  tradingview-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradingview-mcp:latest
    container_name: tradingview-mcp
    ports:
      - "6001:8000"
    restart: unless-stopped
    environment:
      # Optional: Add any future API keys or environment variables here
      - PORT=8000
      - HOST=0.0.0.0
